[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight-ai"
version = "0.1.0"
description = "AI Pre-Push Code Review Assistant with Risk Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # CLI, Config & Logging
    "typer>=0.9.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "platformdirs>=4.2.0",
    "keyring>=25.0.0",
    "loguru>=0.7.3",
    
    # Parsing & Semantics
    # "tree-sitter==0.21.3",
    # "tree-sitter-language-pack>=0.2.0",,
    
    # Machine Learning
    "xgboost>=3.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    
    # LLM & Templating
    "ollama>=0.1.0",
    "jinja2>=3.1.0",
    
    # PDF Generation
    "reportlab>=4.1.0",
    
    # Local API Daemon
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    
    # HTTP & Cloud (No firebase-admin in client)
    "requests>=2.31.0"
]

[project.optional-dependencies]
gui = ["PySide6>=6.9.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0", "mypy>=1.9.0", "build", "twine", "mkdocs"]

[project.scripts]
preflight = "preflight.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]